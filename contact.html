<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pennsylvania Native Plant Initiative - Contact Us</title>
</head>
<body>
    
    <header>
        <h1>Pennsylvania Native Plant Initiative</h1>
        <p>Get in Touch With Us</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="plants.html">Plants</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Contact Our Team</h2>
            <p>Have questions about native plants, conservation, or volunteering? Fill out the form below to reach us.</p>

            <form action="#" method="POST">
                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="subject">Subject:</label><br>
                    <input type="text" id="subject" name="subject" required>
                </p>

                <p>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40" required></textarea>
                </p>

                <p>
                    <label>Preferred Contact Method:</label><br>
                    <input type="radio" id="pref-email" name="preferred_contact" value="email">
                    <label for="pref-email">Email</label><br>
                    <input type="radio" id="pref-phone" name="preferred_contact" value="phone">
                    <label for="pref-phone">Phone</label>
                </p>

                <p>
                    <input type="submit" value="Send Message">
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pennsylvania Native Plant Initiative</p>
    </footer>

</body>
</html>
